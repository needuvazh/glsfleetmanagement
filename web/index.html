<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GLS-IMS Transport Fleet Management System">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GLS-IMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GLS-IMS | Transport Fleet Management</title>
  <link rel="manifest" href="manifest.json">
  
  <script>
    // Fix locale for Flutter web in headless browsers
    (function() {
      var originalLanguage = navigator.language;
      if (!originalLanguage || originalLanguage === '' || originalLanguage === 'C' || originalLanguage === 'C.UTF-8') {
        Object.defineProperty(navigator, 'language', {
          get: function() { return 'en-US'; },
          configurable: true
        });
        Object.defineProperty(navigator, 'languages', {
          get: function() { return ['en-US', 'en']; },
          configurable: true
        });
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
